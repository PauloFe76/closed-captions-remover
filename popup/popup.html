<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Subtitle Cleaner</title>
  <style>
    body {
      width: 220px;
      font-family: system-ui, sans-serif;
      padding: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    button#openOptions {
      margin-top: 10px;
      width: 100%;
      padding: 6px;
      cursor: pointer;
    }
    .status {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="row">
    <span>Filtro activo</span>
    <input type="checkbox" id="enabledToggle" />
  </div>
  <div class="status" id="statusText"></div>
  <button id="openOptions">Reglas de filtrado…</button>

  <script src="popup.js"></script>
</body>
</html>
