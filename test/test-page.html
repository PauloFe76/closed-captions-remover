<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Subtitle Cleaner — Test Harness</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 700px; margin: auto; }
    .case { border: 1px solid #ddd; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
    .case.pass { border-left: 6px solid #2ecc71; }
    .case.fail { border-left: 6px solid #e74c3c; }
    .label { font-weight: 600; }
    .mono { font-family: monospace; font-size: 13px; }
    #summary { font-weight: bold; margin-top: 16px; }
    #modeBar { margin-bottom: 16px; display: flex; gap: 8px; align-items: center; }
    #modeInfo { font-size: 13px; color: #555; margin-bottom: 12px; }
    button.mode { padding: 6px 10px; cursor: pointer; }
    button.mode.active { font-weight: bold; outline: 2px solid #333; }

    /* Estructura real de Netflix: contenedor > span wrapper > span hoja */
    .player-timedtext-text-container { display: block; }
  </style>
</head>
<body>
  <h1>Subtitle Cleaner — Test Harness</h1>

  <div id="modeBar">
    <span>Modo:</span>
    <button class="mode" id="btnFixed">Regresión (valores fijos)</button>
    <button class="mode" id="btnCurrent">Configuración actual</button>
  </div>
  <div id="modeInfo"></div>

  <div id="results"></div>
  <div id="summary"></div>

  <!-- Cada caso instancia su propio contenedor, oculto hasta que se corre el test -->
  <div id="sandbox" style="display: none;"></div>

  <!-- IMPORTANTE: nada de <script>código acá adentro</script>. Las páginas
       de la extensión corren con CSP script-src 'self' por defecto en
       Manifest V3, que bloquea JS inline sin avisar con ningún error
       visible. Todo el JS tiene que venir de archivos .js aparte. -->
  <script src="../content-scripts/core/cleaner.js"></script>
  <script src="../content-scripts/core/subtitle-observer.js"></script>
  <script src="../content-scripts/sites/netflix.js"></script>
  <script src="test-page.js"></script>
</body>
</html>
