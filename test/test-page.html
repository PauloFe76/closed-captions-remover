<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Subtitle Cleaner — Test Harness</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 700px; margin: auto; }
    .case { border: 1px solid #ddd; padding: 10px; margin-bottom: 8px; border-radius: 4px; }
    .case.pass { border-left: 6px solid #2ecc71; }
    .case.fail { border-left: 6px solid #e74c3c; }
    .label { font-weight: 600; }
    .mono { font-family: monospace; font-size: 13px; }
    #summary { font-weight: bold; margin-top: 16px; }
    #modeBar { margin-bottom: 16px; display: flex; gap: 8px; align-items: center; }
    #modeInfo { font-size: 13px; color: #555; margin-bottom: 12px; }
    button.mode { padding: 6px 10px; cursor: pointer; }
    button.mode.active { font-weight: bold; outline: 2px solid #333; }

    /* Estructura real de Netflix: contenedor > span wrapper > span hoja */
    .player-timedtext-text-container { display: block; }
  </style>
</head>
<body>
  <h1>Subtitle Cleaner — Test Harness</h1>

  <div id="modeBar">
    <span>Modo:</span>
    <button class="mode" id="btnFixed">Regresión (valores fijos)</button>
    <button class="mode" id="btnCurrent">Configuración actual</button>
  </div>
  <div id="modeInfo"></div>

  <div id="results"></div>
  <div id="summary"></div>

  <!-- Cada caso instancia su propio contenedor, oculto hasta que se corre el test -->
  <div id="sandbox" style="display: none;"></div>

  <!-- Se cargan directo como scripts de la extensión: no depende de que el
       manifest matchee file:///*, así no requiere el permiso especial
       "permitir acceso a las URLs de archivos". -->
  <script src="../content-scripts/core/cleaner.js"></script>
  <script src="../content-scripts/sites/netflix.js"></script>
  <script>
    // Regresión: valores fijos, independientes de lo que el usuario tenga
    // configurado. Detecta si el regex en sí se rompió.
    const FIXED_RULE_STATES = {
      brackets: true,
      speakerLabel: true,
      parentheses: false,
    };

    const CASES = [
      { id: 'brackets_simple', input: '[music playing]' },
      { id: 'brackets_with_dialogue', input: "[door creaking] Who's there?" },
      { id: 'multiple_brackets', input: '[music playing] [indistinct chatter]' },
      { id: 'speaker_label_only', input: 'JOHN:' },
      { id: 'speaker_label_with_brackets', input: 'JOHN: [sighs] I told you already.' },
      { id: 'pure_dialogue_control', input: "I can't believe this is happening." },
      { id: 'parentheses_untouched', input: '(laughs) That was close.' },
      { id: 'malformed_bracket', input: '[music playing without closing bracket' },
      { id: 'two_lines_different_speakers', input: 'MARY: Wait.\nJOHN: For what?' },
      { id: 'speaker_apostrophe_hyphen', input: "MARY-ANNE'S VOICE: Come in." },
    ];

    // Valores esperados hardcodeados a mano para el modo regresión — NO se
    // calculan llamando a SubtitleCleaner.clean(), para que sigan siendo
    // válidos aunque el regex se rompa (si no, un regex roto "aprendería"
    // su propio resultado incorrecto como correcto).
    const FIXED_EXPECTED = {
      brackets_simple: '',
      brackets_with_dialogue: "Who's there?",
      multiple_brackets: '',
      speaker_label_only: '',
      speaker_label_with_brackets: 'I told you already.',
      pure_dialogue_control: "I can't believe this is happening.",
      parentheses_untouched: '(laughs) That was close.',
      malformed_bracket: '[music playing without closing bracket',
      two_lines_different_speakers: 'Wait.\nJOHN: For what?',
      speaker_apostrophe_hyphen: 'Come in.',
    };

    function buildCaseDOM(testCase) {
      const container = document.createElement('div');
      container.className = 'player-timedtext-text-container';
      container.id = `container-${testCase.id}`;

      const wrapper = document.createElement('span');
      const leaf = document.createElement('span');
      leaf.textContent = testCase.input;

      wrapper.appendChild(leaf);
      container.appendChild(wrapper);
      return container;
    }

    function describeRuleStates(states) {
      return SubtitleCleaner.DEFAULT_RULES
        .map((r) => `${r.label}: ${states[r.id] ? 'ON' : 'OFF'}`)
        .join(' · ');
    }

    async function runTests(mode) {
      document.getElementById('btnFixed').classList.toggle('active', mode === 'fixed');
      document.getElementById('btnCurrent').classList.toggle('active', mode === 'current');

      let ruleStates;
      if (mode === 'fixed') {
        ruleStates = FIXED_RULE_STATES;
      } else {
        // Lee la config real guardada por el usuario en Opciones, SIN
        // pisarla — solo lectura.
        ruleStates = await new Promise((resolve) => {
          chrome.storage.local.get(['subtitleCleanerRuleStates'], (result) => {
            resolve(
              result.subtitleCleanerRuleStates ??
                Object.fromEntries(
                  SubtitleCleaner.DEFAULT_RULES.map((r) => [r.id, r.enabledByDefault])
                )
            );
          });
        });
      }

      SubtitleCleaner.setRuleStates(ruleStates);
      document.getElementById('modeInfo').textContent =
        mode === 'fixed'
          ? `Corriendo con valores fijos → ${describeRuleStates(ruleStates)}`
          : `Corriendo con tu configuración real (Opciones) → ${describeRuleStates(ruleStates)}`;

      const sandbox = document.getElementById('sandbox');
      sandbox.innerHTML = '';
      const resultsEl = document.getElementById('results');
      resultsEl.innerHTML = '';
      let passCount = 0;

      for (const testCase of CASES) {
        const container = buildCaseDOM(testCase);
        sandbox.appendChild(container);

        // darle un tick al MutationObserver para que procese la inserción
        await new Promise((r) => setTimeout(r, 50));

        const leaf = container.querySelector('span span') || container.querySelector('span');
        const actualText = leaf.textContent;
        const actualHidden = container.style.display === 'none';

        // Modo fijo: comparamos contra el valor hardcodeado a mano.
        // Modo actual: comparamos contra lo que da SubtitleCleaner.clean()
        // con el estado real — esto valida el CABLEADO (storage → DOM),
        // no el regex en sí (para eso está el modo fijo).
        const expectedText =
          mode === 'fixed' ? FIXED_EXPECTED[testCase.id] : SubtitleCleaner.clean(testCase.input);
        const expectedHidden = expectedText === '';

        const pass = actualText === expectedText && actualHidden === expectedHidden;
        if (pass) passCount++;

        const caseDiv = document.createElement('div');
        caseDiv.className = `case ${pass ? 'pass' : 'fail'}`;
        caseDiv.innerHTML = `
          <div class="label">${pass ? '✅' : '❌'} ${testCase.id}</div>
          <div class="mono">input: ${JSON.stringify(testCase.input)}</div>
          <div class="mono">esperado: ${JSON.stringify(expectedText)} (hidden=${expectedHidden})</div>
          <div class="mono">obtenido: ${JSON.stringify(actualText)} (hidden=${actualHidden})</div>
        `;
        resultsEl.appendChild(caseDiv);
      }

      document.getElementById('summary').textContent = `${passCount} / ${CASES.length} casos OK`;
    }

    document.getElementById('btnFixed').addEventListener('click', () => runTests('fixed'));
    document.getElementById('btnCurrent').addEventListener('click', () => runTests('current'));

    window.addEventListener('load', () => setTimeout(() => runTests('fixed'), 200));
  </script>
</body>
</html>
